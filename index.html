<style>
:root{--bg:#f2f5fa;--ink:#0f1a2e;--muted:#5a6679;--accent:#0a6fd0;--accent-ink:#fff;--card:#fff;--line:#d8dfeb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--ink:#eef2f9;--muted:#9aa6bb;--accent:#3b97f0;--accent-ink:#04182e;--card:#142038;--line:#243350}}
:root[data-theme="dark"]{--bg:#0b1220;--ink:#eef2f9;--muted:#9aa6bb;--accent:#3b97f0;--accent-ink:#04182e;--card:#142038;--line:#243350}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Cairo,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
html[lang="ar"] body{font-family:Cairo,Inter,system-ui,sans-serif}
header{width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;padding:20px 24px}
.name{font-weight:700;font-size:1.25rem;direction:ltr}
.name b{color:var(--accent)}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;font:600 .9rem Cairo,Inter,sans-serif;cursor:pointer}
.lang:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
main{width:100%;max-width:960px;padding:0 24px 48px;text-align:center}
.hero{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#fff;padding:12px}
.hero img{display:block;width:100%;max-width:620px;height:auto;margin:0 auto}
.tag{margin:28px 0 8px;color:var(--muted);font-size:1.05rem}
.buy{display:inline-block;margin-top:12px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font:700 1.5rem Inter,Cairo,sans-serif;padding:18px 56px;border-radius:14px;transition:transform .15s}
.buy:hover{transform:translateY(-2px)}
.secure{margin-top:20px;display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.secure svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2}
footer{margin-top:auto;padding:24px;color:var(--muted);font-size:.85rem}
</style>
